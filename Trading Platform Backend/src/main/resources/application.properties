# Server Configuration
server.port=${PORT:8080}

# Database Configuration
# - Local dev defaults to MySQL on localhost
# - For production, set:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/trading_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
# Driver auto-detected from URL (PostgreSQL for jdbc:postgresql, MySQL for jdbc:mysql)
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA/Hibernate Configuration
# Dialect will be inferred from the JDBC URL/driver in most cases.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.properties.hibernate.dialect=
# Logging
logging.level.org.springframework.web=INFO
logging.level.com.trading=DEBUG
# Application Name
spring.application.name=Trading Platform Backend

# Alpha Vantage API Configuration
alphavantage.api.key=${ALPHAVANTAGE_API_KEY:}
alphavantage.api.base-url=${ALPHAVANTAGE_API_BASE_URL:https://www.alphavantage.co/query}
alphavantage.api.enabled=${ALPHAVANTAGE_API_ENABLED:true}

# Logging for Alpha Vantage
logging.level.com.trading.service.AlphaVantageService=INFO